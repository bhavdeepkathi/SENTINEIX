services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelx_postgres
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx
      POSTGRES_DB: sentinelx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx -d sentinelx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelx_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinelx:sentinelx@postgres:5432/sentinelx
      - SECRET_KEY=change_me_in_prod
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - OPENAI_API_KEY=your_openai_api_key_here
      - LLM_BASE_URL=https://api.openai.com/v1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # volumes:
    #   - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: